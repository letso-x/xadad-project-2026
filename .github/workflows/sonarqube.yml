name: SonarQube

on:
  push:
    branches:
      - main
      - develop
      - back-end-first-revamp
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path "${{ runner.temp }}\scanner" -ItemType Directory -Force
          dotnet tool install dotnet-sonarscanner --tool-path "${{ runner.temp }}\scanner"

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $solution = ".\mobile\MzukuluQMSMobile\MzukuluQMSMobile.slnx"

          if (-not (Test-Path $solution)) {
            throw "Solution file not found: $solution"
          }

          Write-Host "Building solution: $solution"

          & "${{ runner.temp }}\scanner\dotnet-sonarscanner.exe" begin `
            /k:"letso-x_xadad-project-2026" `
            /o:"letso-x" `
            /d:sonar.token="$env:SONAR_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarScanner begin failed with exit code $LASTEXITCODE"
          }

          dotnet build $solution --no-incremental

          if ($LASTEXITCODE -ne 0) {
            throw "dotnet build failed with exit code $LASTEXITCODE"
          }

          & "${{ runner.temp }}\scanner\dotnet-sonarscanner.exe" end `
            /d:sonar.token="$env:SONAR_TOKEN"

          if ($LASTEXITCODE -ne 0) {
            throw "SonarScanner end failed with exit code $LASTEXITCODE"
          }
